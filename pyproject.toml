[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudradar"
version = "0.1.0"
description = "Real-Time Fraud & Anomaly Detection on Continuous-Time Dynamic Graphs (WiDS 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "optuna>=3.4",
    "matplotlib>=3.7",
    "torch>=2.1",
    "torch-geometric>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["fraudradar*"]

[tool.pytest.ini_options]
testpaths = ["week-1/tests"]
pythonpath = [".", "week-1"]
